name: Integración Continua — SportStockAI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificacion-frontend:
    name: Verificación de Tipos — Frontend Web
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Instalar dependencias
        run: |
          cd frontend
          npm install --no-audit

      - name: Validar tipos de TypeScript
        run: |
          cd frontend
          npm run typecheck

  verificacion-backend:
    name: Compilación y Tipos — Backend API
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package.json'

      - name: Instalar dependencias
        run: |
          cd backend
          npm install --no-audit

      - name: Compilar TypeScript
        run: |
          cd backend
          npm run build

  verificacion-mobile:
    name: Análisis Estático — App Móvil Flutter
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias de Flutter
        run: |
          cd mobile
          flutter pub get

      - name: Ejecutar análisis estático
        run: |
          cd mobile
          flutter analyze --no-fatal-infos || true
